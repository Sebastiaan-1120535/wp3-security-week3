<div class="classes-container">
  {% if classes %}
  <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
    {% for cls in classes %}
    <article class="group relative flex h-full flex-col rounded-2xl border border-border p-5  ">

      <div class="flex items-center gap-3 mb-1">
        <svg aria-hidden xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24"><!-- Icon from Lucide by Lucide Contributors - https://github.com/lucide-icons/lucide/blob/main/LICENSE -->
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path d="M11 22H5.5a1 1 0 0 1 0-5h4.501M21 22l-1.879-1.878" />
            <path d="M3 19.5v-15A2.5 2.5 0 0 1 5.5 2H18a1 1 0 0 1 1 1v8" />
            <circle cx="17" cy="18" r="3" />
          </g>
        </svg>
        <h3 class="text-lg font-bold tracking-tight text-slate-900">
          {{ cls['name'] }}
        </h3>
      </div>

      <p class="text-sm text-slate-500">
        {{ (cls.get('students', []))|length }} leerlingen
      </p>

      <p class="mt-2 text-sm text-slate-600">Open deze klas om leerlingen en resultaten te bekijken.</p>

      <div class="mt-5 border-t border-border pt-4">
        <a href="/class/{{ cls['class_id'] }}" class="btn-primary">
          Bekijk klas
        </a>
      </div>
    </article>
    {% endfor %}
  </div>
  {% else %}
  <div class=" p-6 text-center">
    <p class="text-sm font-medium text-slate-600">Geen klassen gevonden.</p>
  </div>
  {% endif %}
</div>
