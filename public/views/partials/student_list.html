<div class="space-y-2">
  {% for u in students %}
  <div class="rounded-lg space-y-3 w-full border bg-gray-50 px-4 py-3" style="border-color: var(--color-border);">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-medium truncate">{{ u['first_name'] }} {{ u['last_name'] }}</p>
        <p class="text-xs text-slate-500">Student</p>
      </div>
    </div>

    {% if session.get('role') == 'teacher' %}
     
      <a href="/studenten/{{ u['student_id'] }}" class="btn-primary text-sm">
        Bekijk voortgang
      </a>
    {% endif %}

  </div>
  {% else %}
  <div class="rounded-lg border border-border px-4 py-8 text-center text-slate-500">
    Geen studenten gevonden.
  </div>
  {% endfor %}
</div>
