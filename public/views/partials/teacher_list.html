<div class="space-y-2">
  {% for u in teachers %}
  <div class="rounded-lg w-full border bg-gray-50 px-4 py-3" style="border-color: var(--color-border);">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-medium truncate">{{ u['first_name'] }} {{ u['last_name'] }}</p>
        <p class="text-xs text-slate-500">
          Docent
        </p>
      </div>
    </div>
  </div>
  {% else %}
  <div class="rounded-lg border border-border px-4 py-8 text-center text-slate-500">
    Geen docenten gevonden.
  </div>
  {% endfor %}
</div>
