{% extends 'base/base.html' %}
{% block title %}Docenten - LeerDoelZicht{% endblock %}
{% block content %}

<h2 class="text-2xl font-semibold mb-6">Docenten</h2>

<section class="mt-8">
  <div class="card">
    <header class="flex items-center justify-between gap-4 mb-4">
      <h3 class="text-xl font-semibold">Docenten</h3>
      <button
        type="button"
        id="refresh-teachers-list"
        data-refresh="#teachers-list"
        data-url="/api/partial/teachers"
        class="btn-outline"
      >
        Ververs
      </button>
    </header>
    <div id="teachers-list"></div>
  </div>
</section>

{% endblock %}
