{% extends 'base/base.html' %}
{% block title %}Dashboard - LeerDoelZicht{%endblock %}
{% block content %}

<h2 class="text-2xl font-semibold mb-6">Dashboard</h2>

<section class="mb-8">
    <div class="card">
        <h3 class="text-xl font-semibold mb-4">Data Importeren</h3>
        <form action="/import" method="post" enctype="multipart/form-data" class="flex items-center gap-4">
            <input type="file" name="file" accept=".json" required
                class="flex-1 border border-primary rounded px-3 py-2" />
            <button type="submit" class="btn-primary">Importeer JSON</button>
        </form>
    </div>
</section>

<section class="mt-8">
    <section class="mt-8">
        <div class="card">
            <header class="flex items-center justify-between gap-4 mb-4">
                <h3 class="text-xl font-semibold">Mijn Klassen</h3>
                <button type="button" id="refresh-classes-list" class="btn-outline">
                    Ververs
                </button>
            </header>
            <div id="classes-list">{% include 'partials/classes_list.html' %}</div>
        </div>
    </section>
</section>
{% endblock %}
