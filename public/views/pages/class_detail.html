{% extends 'base/base.html' %}
{% block title %}Home{% endblock %}
{% block content %}


<h2 class="text-2xl font-semibold mb-6">{{ cls['name'] }}</h2>

<main class="grid gap-4 md:grid-cols-3  ">

  <section class=" col-span-2">
    <div class="card">
      <header class="flex items-center justify-between gap-4 mb-4">
        <h3 class="text-xl font-semibold">
          Gemiddelde Voortgang Leerdoelen
        </h3>
        <button type="button" id="refresh-class-goals-progress" class="btn-outline">Ververs</button>
      </header>

      <div id="class-goals-progress"></div>
    </div>
  </section>

  <section class=" ">
    <div class="card">

      <div class="card">
        <header class="flex items-center justify-between gap-4 mb-4">
          <h3 class="text-xl font-semibold">Studenten</h3>
          <button type="button" id="refresh-class-students-list" class="btn-outline">
            Ververs
          </button>
        </header>
        <div id="class-students-list"></div>
      </div>

    </div>
  </section>

  <section class="col-span-3 ">
    <div class="card">
      <header class="flex items-center justify-between gap-4 mb-4">
        <h3 class="text-xl font-semibold">Leerdoelen</h3>
        <button type="button" id="refresh-class-student-goals" class="btn-outline">Ververs</button>
      </header>
      <div id="class-student-goals"></div>
    </div>
  </section>

</main>

{% endblock %}
