{% extends 'base/base.html' %}
{% block title %}Registreren - LeerDoelZicht{% endblock %}
{% block content %}

<section class="max-w-md mx-auto">
    <div class="card">
        <h2 class="text-2xl font-semibold mb-6">Registreren</h2>
        
        <form method="post" action="/registreren" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-3 py-2 rounded" style="border: 1px solid var(--color-border); background-color: var(--color-surface);">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium mb-1">Wachtwoord</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 rounded" style="border: 1px solid var(--color-border); background-color: var(--color-surface);">
            </div>
            
            <div>
                <label for="password2" class="block text-sm font-medium mb-1">Bevestig wachtwoord</label>
                <input type="password" id="password2" name="password2" required
                       class="w-full px-3 py-2 rounded" style="border: 1px solid var(--color-border); background-color: var(--color-surface);">
            </div>
            
            <button type="submit" class="btn-primary w-full">
                Registreren
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm" style="color: var(--color-text-muted);">
            Heb je al een account? <a href="/login" class="hover:underline" style="color: var(--color-link);">Log hier in</a>
        </p>
    </div>
</section>

{% endblock %}
