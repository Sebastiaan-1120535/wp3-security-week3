
{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2">
            {% for m in messages %}
                <div class="toast text-white px-4 py-3 rounded shadow-lg" style="background-color: var(--color-primary);">{{ m }}</div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<script type="module" src="{{ url_for('static', filename='js/app.js') }}" defer></script>
